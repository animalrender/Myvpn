name: probe-rows

# Diagnostic job: pulls a few complete `/api/protocols` and `/api/v2/protocols` rows (with the
# real client headers) and commits them, so the encrypted payloads can be analysed offline.
on:
  workflow_dispatch:
  push:
    branches: [arena/b9372ae1-myvpn]
    paths:
      - "android-app/tools/probe-rows.py"
      - ".github/workflows/probe-rows.yml"

permissions:
  contents: write

jobs:
  rows:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Prepare AOSP testkey (same cert the APK is signed with)
        run: |
          set -euo pipefail
          mkdir -p /tmp/keys
          base="https://raw.githubusercontent.com/aosp-mirror/platform_build/master/target/product/security"
          curl -fL --retry 3 -o /tmp/keys/testkey.x509.pem "$base/testkey.x509.pem"
          openssl x509 -in /tmp/keys/testkey.x509.pem -noout -fingerprint -sha256

      - name: Install pycryptodome
        run: python3 -m pip install --quiet pycryptodome

      - name: Fetch complete rows
        env:
          PROBE_CERT: /tmp/keys/testkey.x509.pem
        run: |
          set -uo pipefail
          python3 android-app/tools/probe-rows.py 2>&1 | tee /tmp/rows.log || true
          tail -30 /tmp/rows.log

      - name: Commit the samples
        run: |
          set -euo pipefail
          git config user.name "arena-agent"
          git config user.email "297053741+arena-agent@users.noreply.github.com"
          git add android-app/docs/probe-rows || true
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore(probe): protocol row samples from run ${{ github.run_number }}"
            git push
          fi

      - name: Report the result
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib, urllib.parse
          body = pathlib.Path("/tmp/rows.log").read_text(errors="replace") if pathlib.Path("/tmp/rows.log").exists() else "no log"
          print("::notice title=probe-rows::%s" % urllib.parse.quote(body[-3500:], safe=""))
          PY
