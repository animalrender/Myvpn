name: build-arm64

# Builds the trial APK for arm64-v8a and publishes it as a GitHub Release.
# The heavy/native inputs (libv2ray.aar from AndroidLibXrayLite, hev-socks5-tunnel sources,
# the AOSP test key used for signature-identical API headers) are fetched here, inside the
# runner, and never committed to the repository.

on:
  push:
    branches: [arena/b9372ae1-myvpn]
    paths:
      - "android-app/**"
      - ".github/workflows/build-arm64.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android SDK and NDK
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_HOME:-}" ]; then
            for candidate in /usr/local/lib/android/sdk "$HOME/Android/Sdk" /opt/android-sdk; do
              if [ -d "$candidate" ]; then export ANDROID_HOME="$candidate"; break; fi
            done
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" | tee -a "$GITHUB_ENV"
          echo "SDK dirs:"; ls "$ANDROID_HOME" || true
          echo "NDK dirs:"; ls "$ANDROID_HOME/ndk" 2>/dev/null || echo "(none)"
          NDK="${ANDROID_NDK_LATEST_HOME:-}"
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
            NDK="$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1 || true)"
          fi
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            [ -x "$SDKMANAGER" ] || SDKMANAGER="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" "ndk;27.2.12479018" >/dev/null
            NDK="$ANDROID_HOME/ndk/27.2.12479018"
          fi
          echo "NDK_HOME=$NDK" | tee -a "$GITHUB_ENV"
          echo "ANDROID_NDK_LATEST_HOME=$NDK" | tee -a "$GITHUB_ENV"
          test -x "$NDK/ndk-build"
          java -version

      - name: Make helper scripts executable
        run: chmod +x android-app/tools/*.sh

      - name: Fetch libv2ray.aar (Xray core)
        run: bash android-app/tools/fetch-libv2ray.sh 2>&1 | tee /tmp/fetch-aar.log

      - name: Build hev-socks5-tunnel JNI library (arm64-v8a)
        run: bash android-app/tools/build-hevtun.sh 2>&1 | tee /tmp/build-hev.log

      - name: Prepare release signing key
        run: bash android-app/tools/fetch-testkey.sh 2>&1 | tee /tmp/testkey.log

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Assemble release APK
        working-directory: android-app
        run: |
          set -o pipefail
          gradle --version
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log

      - name: Report failure details
        if: failure()
        run: |
          # Actions logs are not reachable from this environment, so surface the tail of each
          # log as workflow annotations (readable through the check-runs API).
          python3 - <<'PY'
          import os, pathlib, urllib.parse
          chunks = []
          for path in ["/tmp/fetch-aar.log", "/tmp/build-hev.log", "/tmp/testkey.log", "/tmp/gradle.log"]:
              p = pathlib.Path(path)
              if p.exists():
                  tail = p.read_text(errors="replace").splitlines()[-60:]
                  chunks.append("=== %s ===\n%s" % (path, "\n".join(tail)))
          text = "\n".join(chunks) if chunks else "no captured logs"
          encoded = urllib.parse.quote(text[-3500:], safe="")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write("### failure log tail\n```\n%s\n```\n" % text[-3500:])
          print("::error title=build-log::%s" % encoded)
          print("::warning title=build-log-length::%d" % len(text))
          PY

      - name: Inspect the APK
        id: inspect
        run: |
          set -euo pipefail
          APK="$(find android-app/app/build/outputs/apk/release -name '*.apk' | head -1)"
          test -n "$APK"
          echo "==> $APK ($(du -h "$APK" | cut -f1))"
          echo "--- native libraries (must be arm64-v8a only) ---"
          unzip -l "$APK" | grep -E "lib/.*\.so" || true
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libgojni.so" || { echo "::error::Xray core missing from APK"; exit 1; }
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libhev-socks5-tunnel.so" || { echo "::error::hev tun2socks missing from APK"; exit 1; }
          if unzip -l "$APK" | grep -qi "firebase"; then echo "::error::firebase artifacts found"; exit 1; fi
          OUT_NAME="mvpn-trial-arm64-${GITHUB_RUN_NUMBER}.apk"
          cp "$APK" "$OUT_NAME"
          echo "apk=$OUT_NAME" >> "$GITHUB_OUTPUT"
          sha256sum "$OUT_NAME" | tee "$OUT_NAME.sha256"
          SIGNING="$(cat android-app/signing/SIGNING_INFO.txt 2>/dev/null || echo unknown)"
          echo "signing=$SIGNING" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: mvpn-trial-arm64-apk
          path: |
            mvpn-trial-arm64-*.apk
            mvpn-trial-arm64-*.apk.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: trial-arm64-${{ github.run_number }}
          name: MVPN Trial — arm64 build ${{ github.run_number }}
          body: |
            نسخهٔ آزمایشی MVPN Trial برای arm64-v8a — بدون تبلیغ، بدون حساب کاربری، بدون قفل قیمت، بدون Firebase.

            * هستهٔ Xray: `libgojni.so` از `libv2ray.aar` (AndroidLibXrayLite)
            * تونل TUN→SOCKS: `libhev-socks5-tunnel.so` (hev-socks5-tunnel 2.19.3، JNI)
            * امضا: ${{ steps.inspect.outputs.signing }}
            * نصب: `adb install -r <file>.apk` — چون `applicationId` همان `co.asiven.vixentvpn` است، نسخهٔ اصلی باید حذف شود.

            مستندات فارسی: `android-app/docs/README-fa.md`
          files: |
            mvpn-trial-arm64-*.apk
            mvpn-trial-arm64-*.apk.sha256
          fail_on_unmatched_files: true
