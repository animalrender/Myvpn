name: build-arm64

# Builds the trial APK for arm64-v8a and publishes it as a GitHub Release.
# The heavy/native inputs (libv2ray.aar from AndroidLibXrayLite, hev-socks5-tunnel sources,
# the AOSP test key used for signature-identical API headers) are fetched here, inside the
# runner, and never committed to the repository.

on:
  push:
    branches: [arena/b9372ae1-myvpn]
    paths:
      - "android-app/**"
      - ".github/workflows/build-arm64.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Toolchain versions
        run: |
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "NDK candidates:"; ls "$ANDROID_HOME/ndk" 2>/dev/null || echo "(none preinstalled)"
          ls "${ANDROID_NDK_LATEST_HOME:-/nonexistent}" >/dev/null 2>&1 && echo "NDK_LATEST=$ANDROID_NDK_LATEST_HOME" || true

      - name: Ensure an NDK is available
        run: |
          if [ -z "${ANDROID_NDK_LATEST_HOME:-}" ] || [ ! -d "${ANDROID_NDK_LATEST_HOME:-}" ]; then
            yes | sdkmanager --licenses >/dev/null 2>&1 || true
            sdkmanager "ndk;27.2.12479018" >/dev/null
            echo "ANDROID_NDK_LATEST_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          else
            echo "ANDROID_NDK_LATEST_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          fi

      - name: Make helper scripts executable
        run: chmod +x android-app/tools/*.sh

      - name: Fetch libv2ray.aar (Xray core)
        run: bash android-app/tools/fetch-libv2ray.sh

      - name: Build hev-socks5-tunnel JNI library (arm64-v8a)
        run: bash android-app/tools/build-hevtun.sh

      - name: Prepare release signing key
        run: bash android-app/tools/fetch-testkey.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Assemble release APK
        working-directory: android-app
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Inspect the APK
        id: inspect
        run: |
          set -euo pipefail
          APK="$(find android-app/app/build/outputs/apk/release -name '*.apk' | head -1)"
          test -n "$APK"
          echo "==> $APK ($(du -h "$APK" | cut -f1))"
          echo "--- native libraries (must be arm64-v8a only) ---"
          unzip -l "$APK" | grep -E "lib/.*\.so" || true
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libgojni.so" || { echo "!! Xray core missing"; exit 1; }
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libhev-socks5-tunnel.so" || { echo "!! hev tun2socks missing"; exit 1; }
          echo "--- no Firebase expected ---"
          if unzip -l "$APK" | grep -qi "firebase"; then echo "!! firebase artifacts found"; exit 1; fi
          OUT_NAME="mvpn-trial-arm64-${GITHUB_RUN_NUMBER}.apk"
          cp "$APK" "$OUT_NAME"
          echo "apk=$OUT_NAME" >> "$GITHUB_OUTPUT"
          sha256sum "$OUT_NAME" | tee "$OUT_NAME.sha256"
          echo "signing=$(cat android-app/signing/SIGNING_INFO.txt 2>/dev/null || echo unknown)" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: mvpn-trial-arm64-apk
          path: |
            mvpn-trial-arm64-*.apk
            mvpn-trial-arm64-*.apk.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: trial-arm64-${{ github.run_number }}
          name: MVPN Trial — arm64 build ${{ github.run_number }}
          body: |
            نسخهٔ آزمایشی MVPN Trial برای arm64-v8a (بدون تبلیغ، بدون حساب کاربری، بدون قفل قیمت، بدون Firebase).

            * Xray core: `libgojni.so` از `libv2ray.aar` (AndroidLibXrayLite ${{ env.LIBV2RAY_VERSION || 'v26.10.21' }})
            * TUN→SOCKS: `libhev-socks5-tunnel.so` (hev-socks5-tunnel 2.19.3، JNI)
            * امضا: ${{ steps.inspect.outputs.signing }}
            * نصب: `adb install -r ${{ steps.inspect.outputs.apk }}` — چون `applicationId` همان `co.asiven.vixentvpn` است، نسخهٔ اصلی باید حذف شود.

            توضیحات کامل فارسی: `android-app/docs/README-fa.md`
          files: |
            mvpn-trial-arm64-*.apk
            mvpn-trial-arm64-*.apk.sha256
          fail_on_unmatched_files: true
