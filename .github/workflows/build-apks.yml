name: build-apks

# Builds the trial APK for arm64-v8a (real phones) **and** x86_64 (emulators/Chromebooks) and
# publishes both as one GitHub Release. Both APKs are signed with the same AOSP test key so the
# vendor API answers instead of rejecting the signature.
#
# The heavy/native inputs (libv2ray.aar from AndroidLibXrayLite, hev-socks5-tunnel sources,
# the AOSP test key used for signature-identical API headers) are fetched here, inside the
# runner, and never committed to the repository.

on:
  push:
    branches: [arena/b9372ae1-myvpn]
    paths:
      # only rebuild for app code/tooling changes — docs and the report do not need an APK
      - "android-app/app/**"
      - "android-app/tools/**"
      - "android-app/build.gradle.kts"
      - "android-app/settings.gradle.kts"
      - "android-app/gradle.properties"
      - ".github/workflows/build-apks.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            slug: arm64
          - abi: x86_64
            slug: x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android SDK and NDK
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_HOME:-}" ]; then
            for candidate in /usr/local/lib/android/sdk "$HOME/Android/Sdk" /opt/android-sdk; do
              if [ -d "$candidate" ]; then export ANDROID_HOME="$candidate"; break; fi
            done
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" | tee -a "$GITHUB_ENV"
          NDK="${ANDROID_NDK_LATEST_HOME:-}"
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
            NDK="$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1 || true)"
          fi
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            [ -x "$SDKMANAGER" ] || SDKMANAGER="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" "ndk;27.2.12479018" >/dev/null
            NDK="$ANDROID_HOME/ndk/27.2.12479018"
          fi
          echo "NDK_HOME=$NDK" | tee -a "$GITHUB_ENV"
          echo "ANDROID_NDK_LATEST_HOME=$NDK" | tee -a "$GITHUB_ENV"
          test -x "$NDK/ndk-build"
          java -version

      - name: Make helper scripts executable
        run: chmod +x android-app/tools/*.sh

      - name: Fetch libv2ray.aar (Xray core)
        run: |
          set -o pipefail
          bash android-app/tools/fetch-libv2ray.sh 2>&1 | tee /tmp/fetch-aar.log

      - name: Build hev-socks5-tunnel JNI library (${{ matrix.abi }})
        run: |
          set -o pipefail
          HEV_ABI="${{ matrix.abi }}" bash android-app/tools/build-hevtun.sh 2>&1 | tee /tmp/build-hev.log
          ls -lR android-app/app/src/main/jniLibs

      - name: Prepare release signing key
        run: |
          set -o pipefail
          bash android-app/tools/fetch-testkey.sh 2>&1 | tee /tmp/testkey.log

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Assemble release APK (${{ matrix.abi }})
        working-directory: android-app
        run: |
          set -o pipefail
          gradle --version
          gradle assembleRelease --no-daemon -PtargetAbi=${{ matrix.abi }} --stacktrace 2>&1 | tee /tmp/gradle.log

      - name: Inspect the APK
        id: inspect
        run: |
          set -euo pipefail
          APK="$(find android-app/app/build/outputs/apk/release -name '*.apk' | head -1)"
          test -n "$APK"
          ABI="${{ matrix.abi }}"
          echo "==> $APK ($(du -h "$APK" | cut -f1))"
          echo "--- staged jniLibs ---"; find android-app/app/src/main/jniLibs -type f || true
          echo "--- native libraries in APK ---"; unzip -l "$APK" | grep -E "\.so" || true
          unzip -l "$APK" | grep -q "lib/$ABI/libgojni.so" \
            || { echo "::error::Xray core missing from the $ABI APK"; exit 1; }
          unzip -l "$APK" | grep -q "lib/$ABI/libhev-socks5-tunnel.so" \
            || { echo "::error::hev tun2socks missing from the $ABI APK"; exit 1; }
          # Only the requested ABI may be shipped, so the APK stays small and predictable.
          OTHER="$(unzip -l "$APK" | grep -oE 'lib/[^/]+/' | sort -u | grep -v "lib/$ABI/" || true)"
          if [ -n "$OTHER" ]; then
            echo "::error::unexpected ABIs in the $ABI APK: $OTHER"
            exit 1
          fi

          BT="$(ls -d "$ANDROID_HOME/build-tools/"* 2>/dev/null | sort -V | tail -1)"
          echo "--- badging ---"
          "$BT/aapt2" dump badging "$APK" 2>/dev/null | head -6 || true
          echo "--- signature ---"
          "$BT/apksigner" verify --print-certs "$APK" 2>/dev/null | tee /tmp/certs.txt || true
          EXPECTED_CERT="a40da80a59d170caa950cf15c18c454d47a39b26989d8b640ecd745ba71bf5dc"
          GOT_CERT="$(grep -i "certificate SHA-256 digest" /tmp/certs.txt | head -1 | sed 's/.*: *//' | tr 'A-Z' 'a-z')"
          if [ "$GOT_CERT" = "$EXPECTED_CERT" ]; then
            echo "==> signature matches the analysed APK (AOSP testkey): $GOT_CERT"
          else
            echo "::warning title=signing::APK certificate is '$GOT_CERT' (expected '$EXPECTED_CERT'); API headers may not match"
          fi
          OUT_NAME="mvpn-trial-${{ matrix.slug }}-${GITHUB_RUN_NUMBER}.apk"
          cp "$APK" "$OUT_NAME"
          echo "apk=$OUT_NAME" >> "$GITHUB_OUTPUT"
          sha256sum "$OUT_NAME" | tee "$OUT_NAME.sha256"
          SIGNING="$(cat android-app/signing/SIGNING_INFO.txt 2>/dev/null || echo unknown)"
          echo "signing=$SIGNING" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: mvpn-trial-${{ matrix.slug }}-apk
          path: |
            mvpn-trial-*.apk
            mvpn-trial-*.apk.sha256
          if-no-files-found: error

      - name: Report failure details
        if: failure()
        run: |
          # Actions logs are not reachable from this environment, so surface the useful part of
          # each log as a workflow annotation (readable through the check-runs API).
          python3 - <<'PY'
          import pathlib, urllib.parse
          sources = ["/tmp/fetch-aar.log", "/tmp/build-hev.log", "/tmp/testkey.log", "/tmp/gradle.log"]
          errs, tail = [], {}
          for path in sources:
              p = pathlib.Path(path)
              if not p.exists():
                  continue
              lines = p.read_text(errors="replace").splitlines()
              tail[path] = lines[-60:]
              for line in lines:
                  low = line.lower()
                  if line.startswith("e: ") or " error:" in low or low.startswith("error:") \
                     or "what went wrong" in low or "could not resolve" in low or line.startswith("! "):
                      errs.append(line)
          errs = list(dict.fromkeys(errs))
          if errs:
              print("::error title=kotlin-gradle-errors::%s" % urllib.parse.quote("\n".join(errs)[-6000:], safe=""))
          flat = [l for chunk in tail.values() for l in chunk]
          print("::warning title=log-tail::%s" % urllib.parse.quote("\n".join(flat)[-6000:], safe=""))
          PY

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download both APKs
        uses: actions/download-artifact@v4
        with:
          pattern: mvpn-trial-*-apk
          merge-multiple: true

      - name: Show the assets
        run: ls -l

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: trial-${{ github.run_number }}
          name: MVPN Trial — build ${{ github.run_number }}
          body: |
            نسخهٔ آزمایشی MVPN Trial — بدون تبلیغ، بدون حساب کاربری، بدون قفل قیمت (Firebase طبق اپ اصلی).

            دو فایل در این انتشار هست:

            | فایل | معماری | کاربرد |
            | --- | --- | --- |
            | `mvpn-trial-arm64-*.apk` | `arm64-v8a` | گوشی و تبلت اندرویدی (نسخهٔ اصلی) |
            | `mvpn-trial-x86_64-*.apk` | `x86_64` | شبیه‌ساز اندروید و کروم‌بوک |

            * هستهٔ Xray: `libgojni.so` از `libv2ray.aar` (AndroidLibXrayLite v26.10.21)
            * تونل TUN→SOCKS: `libhev-socks5-tunnel.so` (hev-socks5-tunnel 2.19.3، JNI)
            * امضا: AOSP testkey — همان امضای APK اصلی، تا هدرهای امضا در بک‌اند پذیرفته شوند
            * نصب: `adb install -r <file>.apk` — چون `applicationId` همان `co.asiven.vixentvpn` است، نسخهٔ اصلی باید حذف شود.

            مستندات فارسی: `android-app/docs/README-fa.md`
          files: |
            mvpn-trial-*.apk
            mvpn-trial-*.apk.sha256
          fail_on_unmatched_files: true
